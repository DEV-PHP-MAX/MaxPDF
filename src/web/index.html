<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Max PDF</title>
  <script>
    // Aplica o tema antes do primeiro paint para não piscar.
    (function () {
      var t = null;
      try { t = localStorage.getItem("maxpdf-theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Abertura -->
  <div class="preloader" aria-hidden="true">
    <div class="preloader-mark">
      <!-- Mesma geometria de assets/icons/maxpdf.svg, separada em peças para animar -->
      <svg viewBox="0 0 512 512" class="logo-svg">
        <defs>
          <linearGradient id="pre-bg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3D9BFF"/><stop offset=".55" stop-color="#5B6CFF"/><stop offset="1" stop-color="#9A4DFF"/>
          </linearGradient>
          <radialGradient id="pre-shine" cx="150" cy="70" r="360" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="pre-ink" x1="200" y1="250" x2="330" y2="380" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2F7BFF"/><stop offset="1" stop-color="#8B3DFF"/>
          </linearGradient>
        </defs>
        <g class="lp-bg">
          <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#pre-bg)"/>
          <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#pre-shine)"/>
        </g>
        <rect class="lp-back" x="134" y="118" width="214" height="276" rx="30" fill="#fff" fill-opacity=".28" transform="rotate(-11 241 256)"/>
        <g class="lp-front">
          <path d="M192 104h122l86 86v204a30 30 0 0 1-30 30H192a30 30 0 0 1-30-30V134a30 30 0 0 1 30-30z" fill="#fff"/>
          <path class="lp-fold" d="M314 104v56a30 30 0 0 0 30 30h56z" fill="#D9DEFF"/>
        </g>
        <path class="lp-m" d="M214 372V254l67 76 67-76v118" fill="none" stroke="url(#pre-ink)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="preloader-word"><span>MAX</span><span class="grad">PDF</span></div>
    </div>
  </div>

  <!-- Fundo -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="logo.svg" alt="" width="46" height="46">
        <div class="brand-text">
          <strong>MAX <span class="grad">PDF</span></strong>
          <small>Ferramentas para PDF</small>
        </div>
      </div>

      <nav class="nav" aria-label="Ferramentas">
        <span class="nav-pill" aria-hidden="true"></span>
        <!-- itens gerados pelo app.js -->
      </nav>

      <div class="sidebar-foot">
        <div class="offline-badge" title="Nenhum arquivo sai do seu computador">
          <span class="pulse-dot"></span>
          <span>100% offline</span>
        </div>
        <div class="foot-row">
          <span class="version" id="version">Max PDF</span>
          <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro">
            <i data-icon="sun" class="ico-sun"></i><i data-icon="moon" class="ico-moon"></i>
          </button>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="view" id="view"><!-- conteúdo da ferramenta --></div>
    </main>
  </div>

  <!-- Camada de arrastar arquivos -->
  <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
    <div class="drop-overlay-inner">
      <div class="drop-overlay-icon"><i data-icon="download"></i></div>
      <strong id="dropOverlayText">Solte para adicionar</strong>
    </div>
  </div>

  <!-- Resumo -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
      <div class="modal-badge" id="modalBadge">
        <svg viewBox="0 0 80 80">
          <circle class="ring" cx="40" cy="40" r="34" fill="none" stroke-width="4"/>
          <path class="check" d="M25 41l10 10 20-22" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="cross" d="M29 29l22 22M51 29L29 51" fill="none" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 id="modalTitle">Pronto</h2>
      <p class="modal-sub" id="modalSub"></p>
      <div class="stats" id="modalStats"></div>
      <div class="errors" id="modalErrors" hidden></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/Flip.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
