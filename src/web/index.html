<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Max PDF</title>
  <script>
    // Aplica o tema antes do primeiro paint para não piscar.
    (function () {
      var t = null;
      try { t = localStorage.getItem("maxpdf-theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Abertura -->
  <div class="preloader" aria-hidden="true">
    <div class="preloader-mark">
      <svg viewBox="0 0 64 64" class="logo-svg">
        <defs>
          <linearGradient id="lg-pre" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--accent)"/>
            <stop offset="1" stop-color="var(--accent-2)"/>
          </linearGradient>
        </defs>
        <path class="draw" d="M18 6h20l14 14v34a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z" fill="none" stroke="url(#lg-pre)" stroke-width="3.2" stroke-linejoin="round"/>
        <path class="draw" d="M38 6v14h14" fill="none" stroke="url(#lg-pre)" stroke-width="3.2" stroke-linejoin="round"/>
        <path class="draw" d="M22 46V30l9 10 9-10v16" fill="none" stroke="url(#lg-pre)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="preloader-word"><span>MAX</span><span class="grad">PDF</span></div>
    </div>
  </div>

  <!-- Fundo -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 64 64" class="logo-svg">
            <defs>
              <linearGradient id="lg-side" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="var(--accent)"/>
                <stop offset="1" stop-color="var(--accent-2)"/>
              </linearGradient>
            </defs>
            <path d="M18 6h20l14 14v34a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z" fill="none" stroke="url(#lg-side)" stroke-width="4" stroke-linejoin="round"/>
            <path d="M38 6v14h14" fill="none" stroke="url(#lg-side)" stroke-width="4" stroke-linejoin="round"/>
            <path d="M22 46V30l9 10 9-10v16" fill="none" stroke="url(#lg-side)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>MAX <span class="grad">PDF</span></strong>
          <small>Ferramentas para PDF</small>
        </div>
      </div>

      <nav class="nav" aria-label="Ferramentas">
        <span class="nav-pill" aria-hidden="true"></span>
        <!-- itens gerados pelo app.js -->
      </nav>

      <div class="sidebar-foot">
        <div class="offline-badge" title="Nenhum arquivo sai do seu computador">
          <span class="pulse-dot"></span>
          <span>100% offline</span>
        </div>
        <div class="foot-row">
          <span class="version" id="version">Max PDF</span>
          <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro">
            <i data-icon="sun" class="ico-sun"></i><i data-icon="moon" class="ico-moon"></i>
          </button>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="view" id="view"><!-- conteúdo da ferramenta --></div>
    </main>
  </div>

  <!-- Camada de arrastar arquivos -->
  <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
    <div class="drop-overlay-inner">
      <div class="drop-overlay-icon"><i data-icon="download"></i></div>
      <strong id="dropOverlayText">Solte para adicionar</strong>
    </div>
  </div>

  <!-- Resumo -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
      <div class="modal-badge" id="modalBadge">
        <svg viewBox="0 0 80 80">
          <circle class="ring" cx="40" cy="40" r="34" fill="none" stroke-width="4"/>
          <path class="check" d="M25 41l10 10 20-22" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="cross" d="M29 29l22 22M51 29L29 51" fill="none" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 id="modalTitle">Pronto</h2>
      <p class="modal-sub" id="modalSub"></p>
      <div class="stats" id="modalStats"></div>
      <div class="errors" id="modalErrors" hidden></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/Flip.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="vendor/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
