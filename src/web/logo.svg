<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Max PDF</title>
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset=".55" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#9A4DFF"/>
    </linearGradient>
    <radialGradient id="shine" cx="150" cy="70" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="200" y1="250" x2="330" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1B0F5C" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#shine)"/>

  <!-- folha de trás (lote) -->
  <rect x="134" y="118" width="214" height="276" rx="30" fill="#fff" fill-opacity=".28" transform="rotate(-11 241 256)"/>

  <!-- folha da frente -->
  <g filter="url(#drop)">
    <path d="M192 104h122l86 86v204a30 30 0 0 1-30 30H192a30 30 0 0 1-30-30V134a30 30 0 0 1 30-30z" fill="#fff"/>
  </g>
  <path d="M314 104v56a30 30 0 0 0 30 30h56z" fill="#D9DEFF"/>

  <!-- M em gradiente -->
  <path d="M214 372V254l67 76 67-76v118" fill="none" stroke="url(#ink)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
